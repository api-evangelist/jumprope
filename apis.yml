description: Jumprope was a how-to video creation app backed by lightspeed-venture-partners that let
  creators produce and share step-by-step, swipeable instructional videos. The company (formerly at
  getjumprope.com) was acquired by Snap Inc. in early 2021 and the standalone product was subsequently
  wound down. As of this enrichment pass it operates no independent website, developer portal, or public
  API surface — the getjumprope.com and jumprope.co domains no longer resolve, and the unrelated
  jumprope.com domain is a physical jump-rope retailer on Shopify (not this company). No API artifacts
  could be discovered or derived; this profile is retained as a portfolio-lead record only.
